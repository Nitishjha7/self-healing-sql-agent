services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-employees}
    volumes:
      # PostgreSQL 18+ images store data under a major-version-specific directory
      # (`/var/lib/postgresql/18/docker`), so the mount goes one level up. Keeping
      # the old `/var/lib/postgresql/data` path makes the container refuse to
      # start — it sees data at a path it no longer uses and stops rather than
      # risk running against the wrong cluster.
      - pgdata:/var/lib/postgresql
    ports:
      # Host port override-able, backend aur frontend ki tarah — is machine pe
      # doosre projects ke Postgres containers 5432 pehle hi le lete hain. Backend
      # compose network pe `db:5432` se baat karta hai, to ye publish sirf host se
      # psql chalane ke liye hai.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@db:5432/${POSTGRES_DB:-employees}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Approved write ko commit karna hai ya chala ke rollback kar dena.
      # Default false: approval flow poora dikhta hai, par demo data safe rehta hai.
      ALLOW_WRITES: ${ALLOW_WRITES:-false}
      # Phase 2: database access ko MCP server ke tools ke through bhejo.
      # Default off — seedha driver tez hai; MCP ka faayda swappability hai.
      USE_MCP: ${USE_MCP:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-5}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      # LangSmith tracing — defaults to off, so the stack runs without a key.
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-self-healing-sql-agent}
    ports:
      # Host port override-able — dusre projects bhi 8000 use karte hain.
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  pgdata:
