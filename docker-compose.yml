services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-employees}
    volumes:
      # PostgreSQL 18+ images store data under a major-version-specific directory
      # (`/var/lib/postgresql/18/docker`), so the mount goes one level up. Keeping
      # the old `/var/lib/postgresql/data` path makes the container refuse to
      # start — it sees data at a path it no longer uses and stops rather than
      # risk running against the wrong cluster.
      - pgdata:/var/lib/postgresql
    ports:
      # Host port is overridable, like the backend and frontend ones — other
      # projects on this machine already claim 5432 for their Postgres containers.
      # The backend talks to `db:5432` on the compose network, so this publish is
      # only for running psql from the host.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@db:5432/${POSTGRES_DB:-employees}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Whether an approved write is committed, or run and then rolled back.
      # Default false: the approval flow is fully visible, the demo data stays safe.
      ALLOW_WRITES: ${ALLOW_WRITES:-false}
      # Phase 2: route database access through the MCP server tools.
      # Default off — the direct driver is faster; the point of MCP is swappability.
      USE_MCP: ${USE_MCP:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-5}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      # LangSmith tracing — defaults to off, so the stack runs without a key.
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-self-healing-sql-agent}
    ports:
      # Host port is overridable — other projects use 8000 too.
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  pgdata:
